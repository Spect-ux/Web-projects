<!DOCTYPE html>
<html lang="en">
<head>

<body>

    <div class="slider">
        <div class="slides">
            <img class="slide"  src="images/white.jpg" alt="White Lamborghini Revuelto">
            <img class="slide"  src="images/Orange.jpg" alt="Orange Lamborghini Revuelto">

        <button class="prev" onclick="prevSlide()">&#10094</button>

    </div>

</body>
